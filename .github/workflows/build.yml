name: Legacy CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Legacy build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        if: runner.os != 'Windows'
        run: chmod +x ./gradlew

      - name: Build and test legacy
        if: runner.os != 'Windows'
        run: ./gradlew build --stacktrace

      - name: Build and test legacy (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat build --stacktrace

      - name: Upload legacy jar
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: thermite-legacy
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: legacy-test-reports-${{ matrix.os }}
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
